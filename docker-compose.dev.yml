# Development stack: Postgres, Mailpit and the API, with both frontends running
# on the host via `pnpm dev`. Bring it up with `make dev` or:
#   docker compose -f docker-compose.dev.yml up --build
name: kode-portal-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kode
      POSTGRES_PASSWORD: kode_dev_password
      POSTGRES_DB: kode_portal
    # Published on 55432, not 5432. A native PostgreSQL install commonly owns
    # 5432 on the host, and `localhost:5432` then silently resolves to that
    # server instead of this container.
    ports: ['55432:5432']
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kode -d kode_portal']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outbound email in a local web inbox at http://localhost:8025,
  # so the IT support flow is testable end to end without a real SMTP server.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ['8025:8025', '1025:1025']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://kode:kode_dev_password@postgres:5432/kode_portal?schema=public
      API_PUBLIC_URL: http://localhost:4000
      PORTAL_PUBLIC_URL: http://localhost:5173
      ADMIN_PUBLIC_URL: http://localhost:5174
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      JWT_ACCESS_SECRET: dev_access_secret_not_for_production_0123456789
      JWT_REFRESH_SECRET: dev_refresh_secret_not_for_production_9876543210
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      IT_SUPPORT_INBOX: it-support@kodesportsclub.com
      UPLOAD_DIR: /app/storage/uploads
      LOG_LEVEL: debug
    ports: ['4000:4000']
    volumes:
      - uploads-dev:/app/storage/uploads
    # Called through node_modules/.bin rather than `pnpm exec`: the runtime
    # image has no package manager, by design. See apps/api/Dockerfile.
    command: >
      sh -c "./node_modules/.bin/prisma migrate deploy && node dist/main.js"

volumes:
  postgres-dev:
  uploads-dev:
