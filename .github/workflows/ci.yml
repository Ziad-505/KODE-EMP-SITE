name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @kode/contracts build

      - name: Generate the Prisma client
        run: pnpm --filter @kode/api exec prisma generate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm -r test

      # Boots the real application with the database stubbed. Catches the class
      # of error a unit test cannot: an unresolvable provider, a guard wired in
      # the wrong injector, a route that is reachable without authentication.
      - name: Application bootstrap and guard tests
        run: pnpm --filter @kode/api test:boot
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          JWT_ACCESS_SECRET: ci_access_secret_that_is_long_enough_0123456789
          JWT_REFRESH_SECRET: ci_refresh_secret_that_is_long_enough_9876543210

  integration:
    name: Migrations and API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kode
          POSTGRES_PASSWORD: kode_ci_password
          POSTGRES_DB: kode_portal_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://kode:kode_ci_password@localhost:5432/kode_portal_ci?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_that_is_long_enough_0123456789
      JWT_REFRESH_SECRET: ci_refresh_secret_that_is_long_enough_9876543210
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kode/contracts build

      - name: Apply migrations
        run: pnpm --filter @kode/api exec prisma migrate deploy

      - name: Verify the schema matches the migrations
        run: pnpm --filter @kode/api exec prisma migrate diff
          --from-schema-datasource apps/api/prisma/schema.prisma
          --to-schema-datamodel apps/api/prisma/schema.prisma
          --exit-code
        continue-on-error: false

      - name: Seed
        run: pnpm --filter @kode/api db:seed

      - name: API end-to-end tests
        run: pnpm --filter @kode/api test:e2e

  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          build-args: APP=portal
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the CMS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          build-args: APP=admin
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level high
